name: Bug report
description: Report a problem with LearnPath
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any console/server errors.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. In Settings, choose provider ... (or set LLM_PROVIDER to ...)
        2. Open /quiz and ...
        3. See error
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: openai / gpt-4o-mini
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x (or \"live demo\")"
    validations:
      required: true
